[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unified-adaptive-rag"
version = "0.3.0"
description = "Adaptive RAG service with gRPC ml.v1.MLGatewayService transport"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "grpcio>=1.62,<2",
  "protobuf>=5,<7",
  "openai>=1.30,<3",
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "scikit-learn==1.9.0",
  "joblib>=1.3,<2"
]

[project.optional-dependencies]
models = ["sentence-transformers>=3.0,<4"]

[project.scripts]
rag-grpc = "rag_app.grpc_main:main"

[tool.setuptools.packages.find]
where = ["src"]

